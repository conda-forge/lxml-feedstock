schema_version: 1

context:
  version: "6.1.3"

package:
  name: lxml
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/l/lxml/lxml-${{ version }}.tar.gz
  sha256: 45222d94ddd511536f3b2f7d9deae3b2339b4ce0f075f1ca25703b07cad9dd21

build:
  number: 1

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - pkgconf
  host:
    - libxml2-devel
    - python
    - pip
    - setuptools
    - cython
    - libxslt
    - zlib
  run:
    - python

tests:
  - python:
      imports:
        - lxml
        - lxml.etree
        - lxml.objectify
      pip_check: true
  - if: unix
    then:
      - requirements:
          run:
            - jq
        script:
          # ensuring that test.py is not contained. Otherwise ZPL-2.0 and GPL-2.0-only licenses needs to be propagated.
          - |
            test_file=$(jq '.files[] | select( . | endswith("/test.py"))' "${PREFIX}"/conda-meta/lxml-${{ version }}-*.json)
            if [[ ${test_file} ]]; then echo "found test.py file being packaged ${test_file}"; exit 1; fi

about:
  homepage: http://lxml.de/
  # ElementTree comes with a supposedly custom license that is simply MIT-CMU with a different copyright holder.
  license: BSD-3-Clause AND MIT-CMU
  license_file:
    - LICENSES.txt
    - LICENSE.txt
    - doc/licenses/elementtree.txt
    # doc/licenses/BSD.txt is the same as LICENSE.txt
    # doc/licenses/GPL.txt is used in test files only, doesn't get packaged
  summary: Pythonic binding for the C libraries libxml2-devel and libxslt.
  description: |
    The lxml XML toolkit is a Pythonic binding for the C libraries libxml2-devel and
    libxslt. It is unique in that it combines the speed and XML feature
    completeness of these libraries with the simplicity of a native Python API,
    mostly compatible but superior to the well-known ElementTree API.
  documentation: http://lxml.de/index.html#documentation
  repository: https://github.com/lxml/lxml

extra:
  recipe-maintainers:
    - ocefpaf
    - zklaus
    - carlodri
